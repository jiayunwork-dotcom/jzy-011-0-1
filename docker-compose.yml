services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ackermann
      POSTGRES_PASSWORD: ackermann
      POSTGRES_DB: ackermann
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ackermann -d ackermann"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADDR: ":8080"
      # Service name "db" resolves on the compose network.
      DATABASE_URL: "postgres://ackermann:ackermann@db:5432/ackermann?sslmode=disable"
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pgdata:
