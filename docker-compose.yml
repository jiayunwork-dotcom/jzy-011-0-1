services:
  db:
    image: postgres:16-alpine
    container_name: ackermann-db
    environment:
      POSTGRES_USER: ackermann
      POSTGRES_PASSWORD: ackermann
      POSTGRES_DB: ackermann
    ports:
      - "5432:5432"
    volumes:
      - ackermann_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ackermann -d ackermann"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ackermann-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADDR: ":8080"
      STORAGE: "postgres"
      DATABASE_DSN: "postgres://ackermann:ackermann@db:5432/ackermann?sslmode=disable"
      ICR_TOLERANCE_MM: "0.000001"
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  ackermann_pgdata:
